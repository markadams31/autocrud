name: OpenSSF Scorecard

# Scores the repo's supply-chain / security posture — pinned dependencies, token
# permissions, branch protection, dangerous workflow patterns, signed releases,
# etc. — and uploads the result to the Security tab as SARIF. Runs weekly and when
# branch-protection changes; results also publish to the public OpenSSF API (this
# repo is public) for the score badge and continuous-monitoring evidence.
on:
  branch_protection_rule:
  schedule:
    - cron: "41 2 * * 1" # Mondays 02:41 UTC
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write # publish the signed result to the OpenSSF API
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: scorecard.sarif
          category: scorecard
