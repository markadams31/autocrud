[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autocrud-backend"
version = "0.1.0"
description = "Metadata-driven CRUD API over Azure SQL Database."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.49.0",
    # Pinned to the 2.1 line: 2.1.0b2 added the mssql+mssqlpython dialect this
    # app runs on. The explicit pre-release floor lets the resolver use the
    # beta now and pick up 2.1 final automatically when it ships; the golden
    # reflection snapshot (tests/integration) arbitrates any behaviour drift
    # on that upgrade. Verified against SQL Server 2025.
    "sqlalchemy>=2.1.0b3,<2.2",
    # Microsoft's first-party driver, replacing pyodbc: natively fetches the CLR
    # types (hierarchyid/geometry/geography) and sql_variant that pyodbc raises
    # -151/-16 on, and bundles its own driver — no msodbcsql18/unixODBC install
    # in the runtime image. json/vector fetch as strings, same as before.
    "mssql-python>=1.10",
    "azure-identity>=1.15",
    "cachetools>=5.3",      # TTLCache.expire() returning evicted items requires 5.3+
    "python-dotenv>=1.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",  # typed env config (config.py)
    "tenacity>=8.0",           # connection-acquisition retry (connection.py)
    # Ships logs/traces/exceptions/requests to Application Insights. Activated
    # only when APPLICATIONINSIGHTS_CONNECTION_STRING is set (see telemetry.py),
    # so it's inert in local/test runs.
    #
    # Floor raised to 1.8.9 (was >=1.6): 1.8.2 requires opentelemetry-sdk~=1.36,
    # but this app's other instrumentation packages (opentelemetry-instrumentation-
    # fastapi, needed at >=0.64b0 for compatibility with fastapi>=0.110 — older
    # 0.57b0 crashes every request with `AttributeError: '_IncludedRouter' object
    # has no attribute 'path'`, a routing-internals shape that only exists in
    # newer FastAPI/Starlette) pull in opentelemetry-sdk 1.43.x. uv's resolver
    # then picked 1.8.2 anyway since its floor was satisfied, producing an
    # opentelemetry-sdk that satisfies every *declared* range on paper but breaks
    # 1.8.2's own exporter at import time (`ImportError: cannot import name
    # 'LogData' from 'opentelemetry.sdk._logs'` — LogData moved after the 1.8.2
    # exporter's actual ~=1.35 window). 1.8.9 requires opentelemetry-sdk~=1.43.0
    # and opentelemetry-instrumentation-fastapi>=0.64b0,<0.65.0 — internally
    # consistent with what this app's FastAPI version actually needs. Pin the
    # floor (not just >=1.6) so a future resolve can't silently regress to an
    # older azure-monitor-opentelemetry release whose own pins are stale again.
    "azure-monitor-opentelemetry>=1.8.9",
    # FastAPI request-span instrumentation, applied explicitly per-app in
    # telemetry.instrument_fastapi (the distro's class-level auto-instrumentation
    # produced no spans here). Declared explicitly so it's guaranteed present;
    # unpinned to resolve within the distro's compatible version range.
    "opentelemetry-instrumentation-fastapi",
    # Database statement tracing — emits one dependency span per executed query
    # (SQL text, duration) so database time shows up in App Insights
    # AppDependencies, nested under the request span. Applied in
    # telemetry.instrument_sqlalchemy by patching mssql_python.connect directly
    # (DB-API layer, not SQLAlchemy) so every connection.py engine — the
    # reflection engine and each per-user OBO engine — is traced regardless of
    # SQLAlchemy version. Deliberately NOT opentelemetry-instrumentation-
    # sqlalchemy: every released version (<2.1.0 as of 0.64b0) is incompatible
    # with the SQLAlchemy 2.1 line this app requires for the mssql+mssqlpython
    # dialect, and its default behaviour on an unsupported version is to log a
    # warning and silently skip patching while still reporting success — this
    # app shipped with zero SQL spans for a period before that was caught (see
    # git history). Not pulled in by the distro; unpinned to track its version
    # range.
    "opentelemetry-instrumentation-dbapi",
]

[project.optional-dependencies]
# Install with: pip install -e ".[test]"
test = [
    "pytest>=8.0",
    "httpx>=0.27",          # FastAPI TestClient transport
    "pytest-cov>=5.0",
    "testcontainers>=4.0",  # tier-3 only; needs Docker at runtime
    # Test-only since the mssql-python switch: the integration conftest still
    # bootstraps the container with pyodbc (readiness poll + schema load); the
    # app itself no longer imports it.
    "pyodbc>=5.0",
    # Type gate. Lives in the test extra so `uv run pyright` resolves against the
    # app's real dependencies (SQLAlchemy/Pydantic types) — the CI job and the
    # pre-commit hook both invoke it that way. See [tool.pyright] below.
    "pyright>=1.1.400",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "integration: real SQL Server via Testcontainers; requires Docker. Skipped automatically when Docker is unavailable. Deselect explicitly with -m 'not integration'.",
]

# Lint config for the ruff pre-commit hook (.pre-commit-config.yaml). CI runs no
# Python linter, so this is the source of truth. Defaults otherwise: the enabled
# rules are pyflakes (F) + pycodestyle E4/E7/E9 — deliberately low-noise.
[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Expand when you want more, e.g. extend-select = ["I", "UP", "B"]
# (import-sorting, pyupgrade, flake8-bugbear).

[tool.ruff.lint.per-file-ignores]
# main.py initialises telemetry (instrument_*) before importing the modules that
# build engines/routes, so those imports are deliberately not at the top of file.
"app/main.py" = ["E402"]

# pyright — the backend type gate (CI job "Backend · type check" and the pyright
# pre-commit/pre-push hook, both run as `uv run pyright` so the app's real
# SQLAlchemy/Pydantic types are on the path). "basic" mode catches Optional/None
# and obvious type errors without the ceremony of "strict".
#
# config.py is excluded: it instantiates the pydantic-settings BaseSettings with no
# arguments (values come from the environment), which pyright can't model — it
# reports every settings field as a missing constructor argument (reportCallIssue),
# a framework false positive on a small, stable module. Revisit if pyright gains
# pydantic-settings awareness.
[tool.pyright]
include = ["app"]
ignore = ["app/config.py"]
typeCheckingMode = "basic"
pythonVersion = "3.13"

# bandit (Python SAST) — used by the pre-commit hook and the Security workflow.
# Scan app/ only; tests use asserts and fixtures bandit would otherwise flag.
# Reviewed findings are annotated inline with `# nosec`.
[tool.bandit]
exclude_dirs = ["tests"]

[tool.setuptools.packages.find]
# Auto-discovers app/ and app/routes/ — no manual listing needed.
# run.py and dev_auth_proxy.py are entry points, not importable modules,
# and deliberately live outside app/.
where = ["."]
include = ["app*"]
